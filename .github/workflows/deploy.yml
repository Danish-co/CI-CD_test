name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danish-co/ci-cd-test-api:${{ github.sha }}
            ghcr.io/danish-co/ci-cd-test-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/danish-co/ci-cd-test-api:${{ github.sha }}

            docker stop ci-cd-test-api || true
            docker rm ci-cd-test-api || true

            docker run -d \
              --name ci-cd-test-api \
              --restart unless-stopped \
              -p 9000:9000 \
              ghcr.io/danish-co/ci-cd-test-api:${{ github.sha }}

            docker image prune -f
